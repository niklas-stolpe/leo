  <rect x="239" y="224" width="34" height="5" rx="1.5" fill="#b8955a"/>
  <rect x="239" y="234" width="34" height="5" rx="1.5" fill="#b8955a"/>
  <!-- STAGE-etikett -->
  <rect x="136" y="352" width="240" height="72" rx="10" fill="#8b2e2e"/>
  <rect x="144" y="360" width="224" height="56" rx="6" fill="none" stroke="#ece4d4" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="256" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" letter-spacing="8" fill="#ece4d4">STAGE</text>
