  </defs>
  <rect width="512" height="512" fill="#ece4d4"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#8b2e2e" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- skaft -->
  <rect x="243" y="200" width="26" height="160" rx="6" fill="url(#skaft)"/>
  <!-- handtag (derby) -->
  <path d="M132 170 C134 150 170 142 214 150 C250 156 286 158 318 148 C350 138 384 140 392 160 C398 176 382 188 356 186 C326 184 294 182 272 194 L272 214 L240 214 L240 194 C214 184 180 192 154 190 C138 188 131 180 132 170 Z" fill="url(#tra)"/>
