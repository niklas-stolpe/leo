name: Claude

# Claude bygger när någon skriver @claude – i ett nytt issue (mallarna "Önskemål" och "Ny käpp"
# har @claude förifyllt), i en issue-kommentar eller på en PR.
#   Issue → Claude läser önskemålet, bygger på en egen branch och öppnar en PR. Förhandsvisningen
#           byggs av Cloudflare på stage-adressen; Leo svarar "godkänt" eller "@claude ändra …".
#   PR    → Claude ändrar på PR:ens branch (t.ex. "@claude gör bilderna större", "@claude åtgärda granskningsfynden").
# Arbetssättet står i CLAUDE.md, avsnittet "När du kör i GitHub".
#
# Kräver: Claude Code GitHub App installerad + repo-secret CLAUDE_CODE_OAUTH_TOKEN
#         (`claude setup-token` – drar från Admins prenumeration tills Leo har en egen, B-09).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Bara @claude från en människa (inte bot → inga loopar med granskaren eller förhandsvisningen).
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Leos mejlärenden (F-46, F-47): issues med etiketten mejl skapas av inkorgen (inkorg/Kod.gs).
      # De körs med Admins val av modell och effort och räknas mot Leos tokenkvot (scripts/leo-kvot.sh).
      - name: Leos kvot
        id: kvot
        if: contains(github.event.issue.labels.*.name, 'mejl') || contains(github.event.pull_request.labels.*.name, 'mejl')
        env:
          GH_TOKEN: ${{ secrets.PROCESS_TOKEN }}
        run: |
          status="$(bash scripts/leo-kvot.sh status)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != ok ]; then
            # Beskedet om paus eller slut kvot mejlas bara en gång per ärende.
            redan="$(gh issue view "${{ github.event.issue.number || github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[] | select(.body | test("utrymme för Claude är slut|Claude tar en paus"))] | length')"
            [ "$redan" -eq 0 ] || exit 0
            if [ "$status" = slut ]; then
              text="Hej Leo! Månadens utrymme för Claude är slut – det fylls på igen den 1:a nästa månad. Hör av dig till Niklas om något brådskar."
            else
              text="Hej Leo! Claude tar en paus just nu – Niklas har pausat det tillfälligt. Ditt mejl ligger kvar och tas om hand senare."
            fi
            gh issue comment "${{ github.event.issue.number || github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "<!-- till-leo -->
          $text
          <!-- /till-leo -->"
          fi

      - name: Installera webbplatsens beroenden
        if: steps.kvot.outputs.status == '' || steps.kvot.outputs.status == 'ok'
        working-directory: site
        run: npm ci

      - name: Claude
        id: claude
        if: steps.kvot.outputs.status == '' || steps.kvot.outputs.status == 'ok'
        uses: anthropics/claude-code-action@v1
        env:
          # "publicera version N på prod" (scripts/publicera-version.sh) byter prod-version hos Cloudflare.
          # Inga Cloudflare-nycklar när Claude läser mejltext (prompt injection) – mejlärenden publicerar aldrig.
          CLOUDFLARE_API_TOKEN: ${{ steps.kvot.outputs.status == '' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kvot.outputs.status == '' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Edit,Write,Read,Glob,Grep,Bash(npm run check:*),Bash(npm run build:*),Bash(npm run check),Bash(npm run build),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(curl:*),Bash(file:*),Bash(bash scripts/publicera-version.sh:*),Bash(bash scripts/pr-preview.sh:*)"
            ${{ steps.kvot.outputs.status == 'ok' && format('--model {0} --effort {1}', vars.LEO_CLAUDE_MODELL || 'claude-opus-5-5', vars.LEO_CLAUDE_EFFORT || 'medium') || '' }}
            --append-system-prompt "Du kör i GitHub för projektet Leo. Följ CLAUDE.md, särskilt avsnittet 'När du kör i GitHub'. Den som skriver är oftast Leo – konstnär, ingen teknisk bakgrund. Svara honom på enkel svenska utan tekniska ord. Är issuet ett mejlärende (etiketten mejl) – följ avsnittet 'Mejl från Leo' i CLAUDE.md."

      - name: Räkna Leos tokens
        if: always() && steps.kvot.outputs.status == 'ok' && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.PROCESS_TOKEN }}
        run: bash scripts/leo-kvot.sh lagg-till "${{ steps.claude.outputs.execution_file }}" "${{ github.event.issue.number || github.event.pull_request.number }}"
