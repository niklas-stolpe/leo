name: Claude

# Claude bygger när någon skriver @claude – i ett nytt issue (mallarna "Önskemål" och "Ny käpp"
# har @claude förifyllt), i en issue-kommentar eller på en PR.
#   Issue → Claude läser önskemålet, bygger på en egen branch och öppnar en PR. Förhandsvisningen
#           byggs av Cloudflare på stage-adressen; Leo svarar "godkänt" eller "@claude ändra …".
#   PR    → Claude ändrar på PR:ens branch (t.ex. "@claude gör bilderna större", "@claude åtgärda granskningsfynden").
# Arbetssättet står i CLAUDE.md, avsnittet "När du kör i GitHub".
#
# Kräver: Claude Code GitHub App installerad + repo-secret CLAUDE_CODE_OAUTH_TOKEN
#         (`claude setup-token` – drar från Admins prenumeration tills Leo har en egen, B-09).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Bara @claude från en människa (inte bot → inga loopar med granskaren eller förhandsvisningen).
    if: >
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installera webbplatsens beroenden
        working-directory: site
        run: npm ci

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Edit,Write,Read,Glob,Grep,Bash(npm run check:*),Bash(npm run build:*),Bash(npm run check),Bash(npm run build),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(curl:*),Bash(file:*)"
            --append-system-prompt "Du kör i GitHub för projektet Leo. Följ CLAUDE.md, särskilt avsnittet 'När du kör i GitHub'. Den som skriver är oftast Leo – konstnär, ingen teknisk bakgrund. Svara honom på enkel svenska utan tekniska ord."
