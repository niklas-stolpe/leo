name: Claude

# Claude bygger när någon skriver @claude – i ett nytt issue (mallarna "Önskemål" och "Ny käpp"
# har @claude förifyllt), i en issue-kommentar eller på en PR.
#   Issue → Claude läser önskemålet, bygger på en egen branch och öppnar en PR. Förhandsvisningen
#           byggs av Cloudflare på stage-adressen; Leo svarar "godkänt" eller "@claude ändra …".
#   PR    → Claude ändrar på PR:ens branch (t.ex. "@claude gör bilderna större", "@claude åtgärda granskningsfynden").
# Arbetssättet står i CLAUDE.md, avsnittet "När du kör i GitHub".
#
# Kräver: Claude Code GitHub App installerad + repo-secret CLAUDE_CODE_OAUTH_TOKEN
#         (`claude setup-token` – drar från Admins prenumeration tills Leo har en egen, B-09).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write   # "försök igen" startar mejl-version.yml (gh workflow run)

jobs:
  claude:
    # Bara @claude från en människa (inte bot → inga loopar med granskaren eller förhandsvisningen).
    # Repot är publikt: bara Admin (nstolpeflir) får skriva – och inkorgen skriver med Admins nyckel, så Leos mejl
    # räknas. Alla andra, även organisationens medlemmar, kan bara läsa (Admin 2026-10-24).
    if: >
      github.event.sender.login == 'nstolpeflir' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Leos mejlärenden (F-46, F-47): issues med etiketten mejl skapas av inkorgen (inkorg/Kod.gs).
      # De körs med Admins val av modell och effort och räknas mot Leos tokenkvot (scripts/leo-kvot.sh).
      - name: Leos kvot
        id: kvot
        if: contains(github.event.issue.labels.*.name, 'mejl') || contains(github.event.pull_request.labels.*.name, 'mejl')
        env:
          GH_TOKEN: ${{ secrets.PROCESS_TOKEN }}
        run: |
          status="$(bash scripts/leo-kvot.sh status)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != ok ]; then
            # Beskedet om paus eller slut kvot mejlas bara en gång per ärende.
            redan="$(gh issue view "${{ github.event.issue.number || github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json comments --jq "[.comments[] | select(.createdAt >= \"$( [ "$status" = slut-byggtid ] && date -u +%Y-%m-01T00:00:00Z || bash scripts/leo-kvot.sh veckostart )\") | select(.body | test(\"utrymme för Claude är slut|byggtid är slut|Claude tar en paus\"))] | length")"
            [ "$redan" -eq 0 ] || exit 0
            if [ "$status" = slut-byggtid ]; then
              text="Hej Leo! Månadens byggtid är slut – den fylls på igen den 1:a nästa månad. Hör av dig till Niklas om något brådskar."
            elif [ "$status" = slut ]; then
              text="Hej Leo! Veckans utrymme för Claude är slut – det fylls på igen på onsdag morgon. Hör av dig till Niklas om något brådskar."
            else
              text="Hej Leo! Claude tar en paus just nu – Niklas har pausat det tillfälligt. Ditt mejl ligger kvar och tas om hand senare."
            fi
            gh issue comment "${{ github.event.issue.number || github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "[[till-leo]]
          $text
          [[/till-leo]]"
          fi

      - name: Installera webbplatsens beroenden
        if: steps.kvot.outputs.status == '' || steps.kvot.outputs.status == 'ok'
        working-directory: site
        run: npm ci

      - name: Claude
        id: claude
        if: steps.kvot.outputs.status == '' || steps.kvot.outputs.status == 'ok'
        uses: anthropics/claude-code-action@v1
        env:
          # "publicera version N på prod" (scripts/publicera-version.sh) byter prod-version hos Cloudflare.
          # Inga Cloudflare-nycklar när Claude läser mejltext (prompt injection) – mejlärenden publicerar aldrig.
          CLOUDFLARE_API_TOKEN: ${{ steps.kvot.outputs.status == '' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.kvot.outputs.status == '' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowed-tools "Edit,Write,Read,Glob,Grep,Bash(npm run check:*),Bash(npm run build:*),Bash(npm run check),Bash(npm run build),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(curl:*),Bash(file:*),Bash(bash scripts/publicera-version.sh:*),Bash(bash scripts/pr-preview.sh:*),Bash(bash scripts/requirements-check.sh:*),Bash(gh workflow run mejl-version.yml:*),Bash(gh run list:*),Bash(gh run view:*)"
            ${{ steps.kvot.outputs.status == 'ok' && format('--model {0} --effort {1}', vars.LEO_CLAUDE_MODELL || 'claude-sonnet-5-5', vars.LEO_CLAUDE_EFFORT || 'medium') || '' }}
            --append-system-prompt "Du kör i GitHub för projektet Leo. Följ CLAUDE.md, särskilt avsnittet 'När du kör i GitHub'. Den som skriver är oftast Leo – konstnär, ingen teknisk bakgrund. Svara honom på enkel svenska utan tekniska ord. Är issuet ett mejlärende (etiketten mejl) – följ avsnittet 'Mejl från Leo' i CLAUDE.md."

      # Tokens räknas här, utan nycklar – själva bokföringen sker i jobbet "efter".
      - name: Tokens i körningen
        id: tokens
        if: always() && steps.kvot.outputs.status == 'ok' && steps.claude.outputs.execution_file != ''
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            const r = [].concat(m).reverse().find((x) => x.type === 'result') ?? {};
            const u = r.usage ?? {};
            console.log('antal=' + ((u.input_tokens ?? 0) + (u.output_tokens ?? 0) + (u.cache_creation_input_tokens ?? 0)));
          " "${{ steps.claude.outputs.execution_file }}" >> "$GITHUB_OUTPUT"

    outputs:
      kvot: ${{ steps.kvot.outputs.status }}
      tokens: ${{ steps.tokens.outputs.antal }}

  # Allt som behöver PROCESS_TOKEN efter Claude körs i ett eget jobb med en ren checkout av main: Claudes
  # arbetskatalog (som ett mejl kan ha styrt – ändrade skript, git-hooks, GITHUB_ENV) når aldrig nyckeln.
  efter:
    needs: claude
    if: always() && needs.claude.outputs.kvot != ''
    runs-on: ubuntu-latest
    # En bokföring i taget – två samtidiga körningar skulle annars kunna skriva över varandras räknare.
    concurrency:
      group: leo-kvot
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.PROCESS_TOKEN }}
      N: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Leo blir aldrig utan besked: kraschar Claudes körning på ett mejlärende får han förslag på vad han kan göra.
      - name: Besked till Leo om körningen misslyckades
        if: needs.claude.result == 'failure' && needs.claude.outputs.kvot == 'ok'
        run: |
          source scripts/lib.sh
          stopp_till_leo "$N" "Claudes körning misslyckades – se [körningen]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."

      # Claude får ibland inte köra gh pr create (behörighet nekad) – då finns ändringen bara på en gren och kedjan
      # stannar. Har Claude pushat en ny claude/issue-N-*-gren för ärendet utan PR öppnar processen PR:en.
      - name: Öppna PR för Claudes gren om den saknas
        if: needs.claude.outputs.kvot == 'ok'
        run: |
          source scripts/lib.sh
          for gren in $(git_nat ls-remote --heads origin "claude/issue-$N-*" | awk '{print $2}' | sed 's#refs/heads/##'); do
            [ -z "$(gh pr list --repo "$REPO" --head "$gren" --state all --json number --jq '.[0].number // empty')" ] || continue
            git_nat fetch -q --depth=50 origin "main:refs/remotes/origin/main" "$gren:refs/remotes/origin/$gren" || continue
            [ "$(git rev-list --count "origin/main..origin/$gren")" -gt 0 ] || continue
            # Bara nya grenar (senaste commit inom 2 timmar) – gamla övergivna grenar lämnas.
            [ $(( $(date +%s) - $(git log -1 --format=%ct "origin/$gren") )) -lt 7200 ] || continue
            titel="$(git log -1 --format=%s "origin/$gren" | cut -c1-100)"
            gh pr create --repo "$REPO" --head "$gren" --base main --title "${titel:-Ändring från Leos mejl #$N}" \
              --body "$(printf 'Closes #%s\n\nUppfyller: – justering\n\n(PR:en öppnad av processen: Claude fick inte öppna den själv.)' "$N")" \
              && echo "Öppnade PR för $gren"
          done

      # Claudes pushar startar varken granskningen eller mejl-version.yml (GitHub startar inga workflows av
      # en push med körningens egen nyckel). Saknar en PR för ärendet granskning på sin senaste commit pushar
      # processen en tom commit med PROCESS_TOKEN – då startar granskning, bygge och kedjan som vanligt.
      - name: Starta granskningen efter Claudes push
        if: needs.claude.outputs.kvot == 'ok'
        run: |
          source scripts/lib.sh
          sleep 30   # en nyöppnad PR hinner registrera sin granskning
          prs="$( { gh pr view "$N" --repo "$REPO" --json number,state --jq 'select(.state=="OPEN") | .number' 2>/dev/null || true
                    gh pr list --repo "$REPO" --state open --search "Closes #$N in:body" --json number --jq '.[].number' || true; } | sort -u)"
          for pr in $prs; do
            # Sökningen är fritext – bara PR:en själv eller en PR som verkligen stänger ärendet räknas.
            [ "$pr" = "$N" ] || pr_closes "$pr" | grep -qx "$N" || continue
            sha="$(pr_field "$pr" .headRefOid)"
            granskad="$(gh api "repos/$REPO/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name=="review")] | length')"
            # Ett fallerat Cloudflare-bygge ("försök igen" från Leo) behöver också ett nytt bygge, inte en omkörning.
            byggfel="$(gh api "repos/$REPO/commits/$sha/check-runs" --jq "[.check_runs[] | select(.name==\"$BUILD_CHECK\" and .conclusion==\"failure\")] | length")"
            [ "$granskad" -eq 0 ] || [ "$byggfel" -gt 0 ] || continue
            bygg_om "$pr" "Starta granskning och bygge (Claudes push startar dem inte)" && echo "Startade granskning och bygge för #$pr"
          done

      - name: Räkna Leos byggtid
        run: bash scripts/leo-kvot.sh minuter "$N" || true

      - name: Räkna Leos tokens
        if: needs.claude.outputs.tokens != ''
        env:
          TOKENS: ${{ needs.claude.outputs.tokens }}   # via miljön – aldrig inklistrat i skriptet
        run: |
          [[ "$TOKENS" =~ ^[0-9]+$ ]] || { echo "::warning::ogiltigt tokenantal – räknas inte"; exit 0; }
          bash scripts/leo-kvot.sh lagg-till "$TOKENS" "$N"
