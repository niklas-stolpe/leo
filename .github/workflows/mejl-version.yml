name: mejl-version

# När granskningen av en ändring från ett av Leos mejlärenden är klar (F-46):
#   grönt bygge + inga olösta granskningstrådar → scripts/merge-pr.sh → ny version → mejl till Leo
#   ("Klart! Version N – titta här"). Prod rörs inte (B-06) – Leo väljer själv på versionssidan.
#   olösta trådar → "@claude åtgärda granskningsfynden" (högst två gånger), sedan besked till Admin.
# Bara PR:er vars issue har etiketten mejl. Kräver PROCESS_TOKEN och Cloudflare-nycklarna
# (version-release.sh bygger demo-versionen och uppdaterar versionssidan).

on:
  workflow_run:
    workflows: ['Claude Code Review']
    types: [completed]

concurrency:
  group: mejl-version-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # Bara när granskningen faktiskt gick klart – en misslyckad eller avbruten granskning är ingen granskning.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROCESS_TOKEN }}
      GREN: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Ingen nyckel i .git/config – bygget av ändringen körs i en worktree som delar den.
          # version-release.sh pushar taggen vN med GH_TOKEN bara för den pushen.
          persist-credentials: false

      - name: Hör ändringen till ett mejlärende?
        id: pr
        run: |
          source scripts/lib.sh
          pr="$(gh pr list --repo "$REPO" --head "$GREN" --state open --json number --jq '.[0].number // empty')"
          [ -n "$pr" ] || { echo "Ingen öppen PR för $GREN"; exit 0; }
          issue="$(pr_closes "$pr" | head -1)"
          [ -n "$issue" ] || { echo "PR #$pr stänger inget issue"; exit 0; }
          gh issue view "$issue" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx mejl || { echo "#$issue är inget mejlärende"; exit 0; }
          # PR:en ärver etiketten, så att "@claude åtgärda granskningsfynden" också räknas mot Leos kvot.
          gh pr edit "$pr" --repo "$REPO" --add-label mejl >/dev/null
          # Mejltext är indata till Claude. Rör ändringen Admins yta (B-07) mergas den aldrig av sig själv.
          admin="$(gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename' \
            | grep -E '^(\.github/|scripts/|inkorg/|versioner/|CLAUDE\.md|site/wrangler|site/package|site/astro\.config|site/[^/]*\.config\.)' || true)"
          if [ -n "$admin" ]; then
            stopp_till_leo "$issue" "ändringen #$pr rör Admins yta och mergas inte av sig själv – granska och kör scripts/merge-pr.sh $pr om den är okej: $(echo $admin)"
            exit 0
          fi
          # Granskningens sammanfattning för PR:ens senaste commit: blockerande fynd → Claude rättar först.
          sha="$(pr_field "$pr" .headRefOid)"
          # Bara granskarens egna kommentarer (Claude-appen) räknas – inte en falsk sammanfattning från någon annan.
          sammanf="$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq '.[] | select(.user.login == "claude[bot]") | .body' \
            | grep -A2 "Granskning – ${sha:0:7}" || true)"
          if [ -z "$sammanf" ]; then
            # Ingen sammanfattning för senaste commit = ingen granskning. Mergas inte.
            stopp_till_leo "$issue" "granskningen av #$pr postade ingen sammanfattning för ${sha:0:7} – ändringen mergas inte av sig själv. Titta på den, eller skriv @claude åtgärda granskningsfynden på PR:en."
            exit 0
          fi
          # "Blockerande: inga" eller "Blockerande: 0" → 0; ett tal > 0 → fynd.
          # (|| true: "inga" ger ingen träff, och med pipefail skulle steget annars dö tyst.)
          block="$(printf '%s' "$sammanf" | grep -oE 'Blockerande: *[0-9]+' | grep -oE '[0-9]+' | tail -1 || true)"
          if [ "${block:-0}" -gt 0 ]; then
            forsok="$(gh pr view "$pr" --repo "$REPO" --json comments --jq '[.comments[] | select(.body | startswith("@claude åtgärda granskningsfynden"))] | length')"
            if [ "$forsok" -lt 2 ]; then gh pr comment "$pr" --repo "$REPO" --body "@claude åtgärda granskningsfynden"
            else stopp_till_leo "$issue" "granskningen av #$pr har fortfarande blockerande fynd efter två försök – titta på den."; fi
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"; echo "issue=$issue" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.pr.outputs.pr != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Merga och skapa version
        id: merge
        if: steps.pr.outputs.pr != ''
        # Cloudflare-nycklarna bara här. Själva bygget av sidan (demo-version.sh) körs utan dem och utan
        # GH_TOKEN, så att kod i en ändring inte kan läsa dem.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd site && env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID -u GH_TOKEN npm ci --silent)
          set -o pipefail
          bash scripts/merge-pr.sh "${{ steps.pr.outputs.pr }}" 2>&1 | tee merge.log

      - name: Mejla Leo att versionen finns
        if: steps.merge.outcome == 'success'
        run: |
          source scripts/lib.sh
          rad="$(grep -oE 'Version [0-9]+ – .*\(https://[^)]+\)' merge.log | sed 's/\x1b\[[0-9;]*m//g' | tail -1 || true)"
          namn="${rad% (*}"; lank="$(printf '%s' "$rad" | grep -oE 'https://[^)]+' || true)"
          if [ -z "$rad" ]; then
            text="Hej Leo! Ändringen är klar. Titta på versionssidan: $VERSIONER_URL"
          else
            text="Hej Leo! Nu är det klart – **$namn**.

          Titta här: $lank

          Gillar du den? Logga in på versionssidan och tryck Publicera på prod (eller på demo om du vill visa den för någon först): $VERSIONER_URL

          Vill du ändra något, svara bara på det här mejlet."
          fi
          gh issue comment "${{ steps.pr.outputs.issue }}" --repo "$REPO" --body "[[till-leo]]
          $text
          [[/till-leo]]"

      - name: Granskningsfynd eller annat stopp
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          source scripts/lib.sh
          pr="${{ steps.pr.outputs.pr }}"
          # Kravgrinden röd (oftast fel på Uppfyller:-raden) → Claude rättar PR-texten och bygger om, högst två gånger.
          if ! grep -q 'Kravgrinden grön' merge.log; then
            forsok="$(gh pr view "$pr" --repo "$REPO" --json comments --jq '[.comments[] | select(.body | startswith("@claude rätta kravgrinden"))] | length')"
            if [ "$forsok" -lt 2 ]; then
              fel="$(grep '✗' merge.log | tr -d '\033' | sed 's/\[[0-9;]*m//g' | head -3 || true)"
              gh pr comment "$pr" --repo "$REPO" --body "@claude rätta kravgrinden: ändra PR-texten (gh pr edit) eller kravraden så att \`bash scripts/requirements-check.sh $pr\` blir grön, och pusha sedan en tom commit så att kedjan körs igen. Felet:
          $fel"
              exit 0
            fi
          fi
          if grep -q 'olöst(a) granskningstråd' merge.log; then
            forsok="$(gh pr view "$pr" --repo "$REPO" --json comments --jq '[.comments[] | select(.body | startswith("@claude åtgärda granskningsfynden"))] | length')"
            if [ "$forsok" -lt 2 ]; then
              gh pr comment "$pr" --repo "$REPO" --body "@claude åtgärda granskningsfynden"
              exit 0
            fi
          fi
          stopp_till_leo "${{ steps.pr.outputs.issue }}" "mejlärendets ändring (#$pr) kunde inte bli en version av sig själv – se [körningen]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
